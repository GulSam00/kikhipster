name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에서 새 푸시가 오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kikhipster
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: kikhipster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kikhipster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend # 절대 경로 import 라 backend/ 를 실행 루트로 고정한다
    env:
      # 테스트 하네스(tests/conftest.py)가 kikhipster_test DB 를 만들고 alembic upgrade head 를 돌린다.
      TEST_DATABASE_URL: postgresql://kikhipster:devpassword@localhost:5432/kikhipster_test
      # config.Settings 가 import 시점에 DATABASE_URL 을 요구한다.
      DATABASE_URL: postgresql://kikhipster:devpassword@localhost:5432/kikhipster_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9' # Dockerfile(python:3.9-slim)과 같은 버전
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    name: frontend (tsc · eslint · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9 # pnpm-lock.yaml lockfileVersion 9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # npm install 이 아니라 pnpm — package-lock.json 이 없고 npm 은 pnpm 링크 구조에서 죽는다(CLAUDE.md).
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint .
      - run: pnpm test
      - run: pnpm build
