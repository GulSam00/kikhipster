[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# NOTE: Keep this file ASCII-only.
# On Python < 3.10, Alembic reads it via ConfigParser without an explicit
# encoding, so it is decoded with the OS locale codec (cp949 on Korean
# Windows). Non-ASCII bytes here raise UnicodeDecodeError before any command
# runs. Korean commentary belongs in alembic/env.py, which Python always
# reads as UTF-8.
#
# The connection URL is injected in alembic/env.py from settings.database_url.
# Never put secrets in this file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
